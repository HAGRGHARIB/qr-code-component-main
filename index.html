<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | QR code component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body{
      min-height: 100vh;
      margin: 0;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: hsl(212, 45%, 89%);
    }

    .card {
      background-color: hsl(0, 0%, 100%);
      border-radius: 20px;
      overflow: hidden;
      width: 320px;
      padding: 15px;
      padding-bottom: 30px;
    }

    .card__image {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      border-radius: 10px;
    }

    .card__title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: hsl(218, 44%, 22%);
      text-align: center;
      padding-left: 15px;
      padding-right: 15px;
    }

    .card__description {
      font-family: 'Outfit', sans-serif;
      color: hsl(216, 15%, 48%);
      text-align: center;
      font-size: 15px;
      font-weight: 400;
      padding-left: 18px;
      padding-right: 18px;

    }

    @media (max-width:376px) {
      .card {
        width: 295px !important;
      }

      .card__description {
        padding-left: 10px;
        padding-right: 10px;

      }
    }
  </style>
</head>

<body>

  <main>
    <div class="card">
      <img src="./images/image-qr-code.png" alt="QR code to visit Frontend Mentor" class="card__image">
      <h1 class="card__title">Improve your front-end skills by building projects</h1>
      <p class="card__description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next
        level
      </p>
    </div>
  </main>
</body>

</html>
